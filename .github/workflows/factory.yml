# ============================================================================
# factory.yml — headless implement → review loop (decision 03/04).
#
# Once a PRD in docs/prd-queue/ is pushed with **Status**: Final and its task
# file is **Status**: prd-ready, this workflow runs the FULL autonomous loop
# headlessly on a GitHub-hosted runner:
#   status gate → bin/factory-run.sh --headless
#     → implementer (sandbox container) → review (sandbox container)
#     → on REQUEST_CHANGES: implementer-run.sh --revise → re-review (cap 3)
#     → stop at APPROVE (merge-ready PR, task in-review)
#     → on cap exhaustion: exit non-zero with the last review report surfaced
#
# The workers stay containerised in the existing sandbox:latest image, built
# in-job from workspace-portability/container/Dockerfile. Docker is the
# container runtime (IMPLEMENTER_PODMAN_BIN=docker seam — the driver's podman
# flags are docker-compatible). herdr/Woodpecker remain local/self-hosted
# extension paths (not built here).
#
# Secrets (repo): FACTORY_GH_PAT, OPENROUTER_API_KEY, ANTHROPIC_API_KEY,
#   LANGFUSE_SECRET_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_BASE_URL
# ============================================================================
name: factory-headless

on:
  push:
    paths:
      - 'docs/prd-queue/**.md'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task slug to run headless (blank = resolve from changed/Final PRDs)'
        required: false
        type: string

# One task at a time (parallel worktrees deferred). Do not cancel an in-flight
# run; queue subsequent pushes behind it.
concurrency:
  group: factory-headless
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  IMPLEMENTER_PODMAN_BIN: docker

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_GH_PAT }}
          fetch-depth: 0

      # Authenticate gh with the cross-repo PAT and teach git to use it, so the
      # drivers' `git push` and `gh pr create/comment/label` work in this job.
      # GITHUB_TOKEN is single-repo; FACTORY_GH_PAT is the cross-repo credential.
      - name: Authenticate gh + configure git
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
        run: |
          echo "$FACTORY_GH_PAT" | gh auth login --with-token
          gh auth setup-git

      # Checkout every repo_map target so the driver's
      # "$WORKSPACE/$TARGET_REPO" git resolution finds repos (shallow).
      - name: Checkout repo_map targets
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          OWNER="${{ github.repository_owner }}"
          jq -r '.repo_map | to_entries[] | select(.value != ".") | .value' \
            config/implementer.json 2>/dev/null | sort -u | while read -r path; do
            if [ -z "$path" ]; then continue; fi
            if git clone --depth 1 "https://github.com/$OWNER/$path.git" "$path"; then
              echo "checked out $OWNER/$path -> $path"
            else
              echo "WARN: could not clone $OWNER/$path (skip — $WORKSPACE/$path not a repo)"
            fi
          done

      # Build the sandbox image the containerised workers run inside.
      - name: Build sandbox image
        run: docker build -t sandbox:latest workspace-portability/container

      # Status gate: only run if a changed PRD is Final AND its task is
      # prd-ready. Resolve the changed slug for --task; fall back to --pick
      # when ambiguous (multiple ready). If nothing is ready, exit 0 silently
      # so an early push to the queue does not half-run.
      - name: Status gate + resolve task slug
        id: gate
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          READY=""
          SLUG="${{ inputs.task || '' }}"
          if [ -n "$SLUG" ]; then
            # Manual dispatch: gate the named slug only.
            prd="$(ls docs/prd-queue/*-"$SLUG.md" 2>/dev/null | head -1 || true)"
            task="docs/tasks/$SLUG.md"
            if [ -n "$prd" ] && grep -q '^\*\*Status\*\*: *Final' "$prd" \
                && [ -f "$task" ] && grep -q '^\*\*Status\*\*: *prd-ready' "$task"; then
              READY="$SLUG"
            fi
          else
            # Push: find changed PRDs that are Final + prd-ready.
            before="${{ github.event.before }}"
            if [ "${before}" != "0000000000000000000000000000000000000000" ] && [ -n "${before}" ]; then
              changed="$(git diff --name-only "$before" "${{ github.event.after }}" -- 'docs/prd-queue/*.md' 2>/dev/null || true)"
            else
              changed=""
            fi
            while read -r prd; do
              [ -z "$prd" ] && continue
              slug="$(basename "$prd" | sed -E 's#^[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md$#\1#')"
              [ -z "$slug" ] && continue
              task="docs/tasks/$slug.md"
              if grep -q '^\*\*Status\*\*: *Final' "$prd" \
                  && [ -f "$task" ] && grep -q '^\*\*Status\*\*: *prd-ready' "$task"; then
                READY="$READY $slug"
              fi
            done <<< "$changed"
            READY="$(echo "$READY" | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          fi

          READY_COUNT="$(echo "$READY" | sed '/^$/d' | wc -l)"
          if [ -z "$READY" ]; then
            echo "No Final+prd-ready PRD matched — exiting silently."
            echo "GATE=false" >> "$GITHUB_OUTPUT"
            echo "TASK_ARGS=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$READY_COUNT" -eq 1 ]; then
            echo "TASK_ARGS=--task $(echo "$READY")" >> "$GITHUB_OUTPUT"
          else
            echo "Ambiguous ($READY_COUNT ready) — falling back to --pick."
            echo "TASK_ARGS=--pick" >> "$GITHUB_OUTPUT"
          fi
          echo "GATE=true" >> "$GITHUB_OUTPUT"

      - name: Run headless factory loop
        if: steps.gate.outputs.GATE == 'true'
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2086
          bin/factory-run.sh --headless ${{ steps.gate.outputs.TASK_ARGS }}
