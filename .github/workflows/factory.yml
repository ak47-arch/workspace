# ============================================================================
# factory.yml — headless implement → review loop (decision 03/04).
#
# Once a PRD in docs/prd-queue/ is pushed with **Status**: Final and its task
# file is **Status**: prd-ready, this workflow runs the FULL autonomous loop
# headlessly on a GitHub-hosted runner:
#   status gate → bin/factory-run.sh --headless
#     → implementer (sandbox container) → review (sandbox container)
#     → on REQUEST_CHANGES: implementer-run.sh --revise → re-review (cap 3)
#     → stop at APPROVE (merge-ready PR, task in-review)
#     → on cap exhaustion: exit non-zero with the last review report surfaced
#
# The workers stay containerised in the existing sandbox:latest image, built
# in-job from workspace-portability/container/Dockerfile. Docker is the
# container runtime for BOTH legs (IMPLEMENTER_PODMAN_BIN=docker and
# REVIEWER_PODMAN_BIN=docker seams — the drivers' podman flags are
# docker-compatible). Podman is NOT usable on GitHub-hosted runners (its
# container start fails instantly, exit 125), so the reviewer leg must get the
# docker seam too — forgetting it makes the review stage fail 3× immediately
# after a successful implementation. herdr/Woodpecker remain local/self-hosted
# extension paths (not built here).
#
# Secrets (repo): FACTORY_GH_PAT, OPENROUTER_API_KEY, ANTHROPIC_API_KEY,
#   LANGFUSE_SECRET_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_BASE_URL
# ============================================================================
name: factory-headless

on:
  push:
    paths:
      - 'docs/prd-queue/**.md'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task slug to run headless (blank = resolve from changed/Final PRDs)'
        required: false
        type: string

# One task at a time (parallel worktrees deferred). Do not cancel an in-flight
# run; queue subsequent pushes behind it.
concurrency:
  group: factory-headless
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  IMPLEMENTER_PODMAN_BIN: docker
  REVIEWER_PODMAN_BIN: docker
  # gh CLI reads GH_TOKEN directly (no `gh auth login`, no scope validation —
  # a classic PAT with repo+workflow intentionally lacks read:org, which
  # `gh auth login --with-token` would demand). Git learns the token via the
  # insteadOf rewrite below, so clones/pushes authenticate as the PAT owner.
  GH_TOKEN: ${{ secrets.FACTORY_GH_PAT }}

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_GH_PAT }}
          fetch-depth: 0

      # Teach git the cross-repo PAT (insteadOf rewrite) so both the repo_map
      # clones below and the drivers' `git push` authenticate as the PAT owner.
      # No `gh auth login` — it would demand read:org on a classic token.
      # GITHUB_TOKEN is single-repo; FACTORY_GH_PAT is the cross-repo credential.
      - name: Configure git credentials (PAT)
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${FACTORY_GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "factory"
          git config --global user.email "factory@ak47.local"

      # Checkout every repo_map target so the driver's
      # "$WORKSPACE/$TARGET_REPO" git resolution finds repos (shallow).
      - name: Checkout repo_map targets
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          OWNER="${{ github.repository_owner }}"
          # Directory name → GitHub repo name for repo_map entries whose local
          # dir name differs from the remote (llm→llamacpp_inference_server,
          # survival-infrastructure→goal-agent). Default: same as dir name.
          declare -A REPO_NAME=(
            [llm]=llamacpp_inference_server
            [survival-infrastructure]=goal-agent
          )
          jq -r '.repo_map | to_entries[] | select(.value != ".") | .value' \
            config/implementer.json 2>/dev/null | sort -u | while read -r path; do
            if [ -z "$path" ]; then continue; fi
            name="${REPO_NAME[$path]:-$path}"
            if git clone --depth 1 "https://github.com/$OWNER/$name.git" "$path"; then
              echo "checked out $OWNER/$name -> $path"
            else
              echo "WARN: could not clone $OWNER/$name -> $path (skip; driver will default to workspace root)"
            fi
          done

      # Build the sandbox image the containerised workers run inside.
      - name: Build sandbox image
        run: docker build -t sandbox:latest workspace-portability/container

      # Status gate: only run if a changed PRD is Final AND its task is
      # prd-ready. Resolve the changed slug for --task; fall back to --pick
      # when ambiguous (multiple ready). If nothing is ready, exit 0 silently
      # so an early push to the queue does not half-run.
      - name: Status gate + resolve task slug
        id: gate
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          READY=""
          SLUG="${{ inputs.task || '' }}"
          if [ -n "$SLUG" ]; then
            # Manual dispatch: gate the named slug only.
            prd="$(ls docs/prd-queue/*-"$SLUG.md" 2>/dev/null | head -1 || true)"
            task="docs/tasks/$SLUG.md"
            if [ -n "$prd" ] && grep -q '^\*\*Status\*\*: *Final' "$prd" \
                && [ -f "$task" ] && grep -q '^\*\*Status\*\*: *prd-ready' "$task"; then
              READY="$SLUG"
            fi
          else
            # Push: find changed PRDs that are Final + prd-ready.
            before="${{ github.event.before }}"
            if [ "${before}" != "0000000000000000000000000000000000000000" ] && [ -n "${before}" ]; then
              changed="$(git diff --name-only "$before" "${{ github.event.after }}" -- 'docs/prd-queue/*.md' 2>/dev/null || true)"
            else
              changed=""
            fi
            while read -r prd; do
              [ -z "$prd" ] && continue
              slug="$(basename "$prd" | sed -E 's#^[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md$#\1#')"
              [ -z "$slug" ] && continue
              task="docs/tasks/$slug.md"
              if grep -q '^\*\*Status\*\*: *Final' "$prd" \
                  && [ -f "$task" ] && grep -q '^\*\*Status\*\*: *prd-ready' "$task"; then
                READY="$READY $slug"
              fi
            done <<< "$changed"
            READY="$(echo "$READY" | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          fi

          READY_COUNT="$(echo "$READY" | sed '/^$/d' | wc -l)"
          if [ -z "$READY" ]; then
            echo "No Final+prd-ready PRD matched — exiting silently."
            echo "GATE=false" >> "$GITHUB_OUTPUT"
            echo "TASK_ARGS=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$READY_COUNT" -eq 1 ]; then
            echo "TASK_ARGS=--task $(echo "$READY")" >> "$GITHUB_OUTPUT"
          else
            echo "Ambiguous ($READY_COUNT ready) — falling back to --pick."
            echo "TASK_ARGS=--pick" >> "$GITHUB_OUTPUT"
          fi
          echo "GATE=true" >> "$GITHUB_OUTPUT"

      - name: Run headless factory loop
        if: steps.gate.outputs.GATE == 'true'
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.factory"
          # Tee the driver orchestration trace (factory-run + both legs' stderr)
          # to a per-run file — bundled for eval retention by the step below.
          # shellcheck disable=SC2086
          bin/factory-run.sh --headless ${{ steps.gate.outputs.TASK_ARGS }} 2>&1 \
            | tee -a "$HOME/.factory/driver-${{ github.run_id }}.log"

      # ====================================================================
      # Trace retention for retrospective analysis / evals (driver + agents).
      # The runner's ~/.factory is ephemeral — the run bundle (raw native pi
      # sessions, streamed transcript, container logs, driver trace, brief,
      # outbox reports, sanitized in-repo session copies, manifest) is pushed
      # to the PRIVATE repo ak47-arch/factory-traces. Raw sessions contain
      # live credentials, so this NEVER goes to the public workspace repo —
      # only sanitized copies do (see finalize_session_copy in the drivers).
      # Runs even on failure so partial runs are eval-able.
      - name: Push trace bundle to factory-traces (eval retention)
        if: always()
        env:
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          BUNDLE="$HOME/.factory/bundles/$RUN_ID"
          mkdir -p "$BUNDLE"
          RUN_DIR="$(ls -dt "$HOME/.factory/runs/"*/ 2>/dev/null | head -1 || true)"
          DRV="$HOME/.factory/driver-$RUN_ID.log"
          # Ghost runs (e.g. a PRD-queue delete from a `transition to complete`
          # archive re-firing the push trigger) skip the loop entirely: the
          # gate says GATE=false and no run dir / driver log exists. Bundle
          # nothing, exit 0 — never turn a no-op job red.
          if { [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; } && [ ! -f "$DRV" ]; then
            echo "  no factory loop this job (gate false / ghost trigger) — skipping trace bundle"
            exit 0
          fi
          # 1. Driver orchestration trace (the loop's full stderr/stdout).
          cp "$DRV" "$BUNDLE/driver.trace.log" 2>/dev/null || true
          if [ -n "$RUN_DIR" ] && [ -d "$RUN_DIR" ]; then
            cp "$RUN_DIR/brief.md" "$BUNDLE/" 2>/dev/null || true
            cp -r "$RUN_DIR/outbox" "$BUNDLE/outbox" 2>/dev/null || true
            [ -d "$RUN_DIR/sessions" ] && cp -r "$RUN_DIR/sessions" "$BUNDLE/sessions" 2>/dev/null || true
            cp "$RUN_DIR/session.jsonl" "$BUNDLE/streamed-session.jsonl" 2>/dev/null || true
            cp "$RUN_DIR"/container-*.log "$BUNDLE/" 2>/dev/null || true
            # Multi-repo run manifest (PRD: monitoring backbone; mirrored into the
            # bookkeeping PR body).
            cp "$RUN_DIR/manifest.json" "$BUNDLE/manifest.json" 2>/dev/null || true
          fi
          # 2. Sanitized session copies the run committed under
          #    docs/knowledge/sessions (in-repo record; matches report IDs).
          cp -r "$GITHUB_WORKSPACE/docs/knowledge/sessions" "$BUNDLE/inrepo-sessions" 2>/dev/null || true
          # 3. Manifest linking the run to its sessions + outcome.
          SLUG="${{ steps.gate.outputs.TASK_ARGS }}"
          SLUG="${SLUG/--task /}"
          [ "$SLUG" = "--pick" ] && SLUG=""
          PR="$(grep -m1 -oE 'PR #?[0-9]+' "$GITHUB_WORKSPACE/docs/tasks/$SLUG.md" 2>/dev/null | head -1 || true)"
          SESSIONS="$( ( cd "$BUNDLE/sessions" 2>/dev/null && ls *.jsonl 2>/dev/null ) | sed -E 's/.*_([0-9a-fA-F-]{36})\.jsonl/\1/' | sort -u | tr '\n' ' ' || true )"
          python3 - "$RUN_ID" "${{ github.event_name }}" "${{ github.repository }}" "${{ github.sha }}" "$SLUG" "$PR" "$SESSIONS" "$(date -Iseconds)" > "$BUNDLE/manifest.json" <<'PY'
          import json, sys
          rid, event, repo, sha, slug, pr, sessions, created = sys.argv[1:9]
          print(json.dumps({
            "run_id": rid,
            "event": event,
            "repo": repo,
            "sha": sha,
            "task": slug or None,
            "pr": pr or None,
            "created": created,
            "session_uuids": [s for s in sessions.split() if s],
          }, indent=2))
          PY
          rm -f "$BUNDLE/secrets.env"
          # 4. Commit + push the bundle to the private traces repo (PAT auth
          #    via the insteadOf rewrite configured earlier in the job).
          TRACES_DIR="$HOME/.factory/traces-repo"
          git clone -q "https://github.com/ak47-arch/factory-traces.git" "$TRACES_DIR" 2>/dev/null \
            || git -C "$TRACES_DIR" pull -q --rebase 2>/dev/null || true
          mkdir -p "$TRACES_DIR/runs/$RUN_ID"
          cp -r "$BUNDLE/." "$TRACES_DIR/runs/$RUN_ID/"
          cd "$TRACES_DIR"
          git add -A
          git -c user.name=factory -c user.email=factory@ak47.local commit -q \
            -m "traces: run $RUN_ID ($SLUG)" || true
          git push -q origin HEAD || git push -q origin HEAD:main || true
          echo "  trace bundle -> ak47-arch/factory-traces runs/$RUN_ID"
      # The drivers persist tracking commits on the workspace checkout (archives
      # in docs/implementations + docs/code-reviews, sanitized knowledge
      # sessions, task transitions, PR tracking). Story 11 (multi-repo delivery
      # bookkeeping PRs) RETIRES the direct-push stream: master receives content
      # ONLY via merged PRs, never from `git push origin master`. Tracking
      # commits are therefore committed locally on the runner; the durable docs
      # copy reaches master through the bookkeeping PR (raised by factory-run.sh
      # at loop end) or the operator's merge of the code PR — never by a
      # direct-push to the default branch.
      - name: Commit tracking changes locally (no direct master push)
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=factory -c user.email=factory@ak47.local commit -q \
              -m "factory(${{ steps.gate.outputs.TASK_ARGS }}): tracking commits from CI run" \
              || true
            echo "  committed tracking changes locally (no master push — master changes only via merged PRs, decision: multi-repo bookkeeping PRs)"
          else
            echo "  no tracking changes to commit"
          fi
